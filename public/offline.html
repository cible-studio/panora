<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panora — Hors ligne</title>
<link rel="icon" href="/images/faviconl.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #f8fafc; color: #0a0c10;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 480px; width: 100%;
    background: #fff; border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 10px 40px -20px rgba(0,0,0,0.1);
    text-align: center;
  }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    background: #fef3c7; border-radius: 20px;
    font-size: 36px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
  p { color: #64748b; margin-bottom: 24px; font-size: 15px; }
  button {
    display: inline-flex; align-items: center; gap: 8px;
    background: #0a0c10; color: #fff; border: 0;
    padding: 12px 24px; border-radius: 999px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  .hint { margin-top: 20px; font-size: 12px; color: #94a3b8; }

  @media (prefers-color-scheme: dark) {
    body { background: #0a0c10; color: #f5f5f7; }
    .card { background: #14171f; box-shadow: 0 10px 40px -20px rgba(0,0,0,0.5); }
    .icon { background: rgba(232,160,32,0.15); }
    p { color: #94a3b8; }
    button { background: #e8a020; color: #0a0c10; }
    .hint { color: #64748b; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Panora a besoin d'une connexion pour afficher les données à jour (campagnes, factures, taxes). Vérifiez votre réseau puis relancez.</p>
    <button onclick="location.reload()">Réessayer</button>
    <p class="hint">L'application reste installée. Vos données seront synchronisées à la reconnexion.</p>
  </div>
</body>
</html>
